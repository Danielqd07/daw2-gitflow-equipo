
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Tienda Informática</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f1f5f9;
            color: #334155;
        }

        header {
            background-color: #1e293b;
            color: white;
            text-align: center;
            padding: 40px;
        }

        nav {
            background-color: #334155;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #2563eb;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        footer {
            background-color: #1e293b;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            header {
                padding: 25px 15px;
            }

            section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Tienda de Informática</h1>
        <p>Contacta con nosotros</p>
    </header>

    <nav>
        <a href="productos.html">Productos</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main>
        <section>
            <h2>Formulario de contacto</h2>

            <p>
                ¿Tienes alguna consulta sobre nuestros
                productos? Envíanos un mensaje.
            </p>

            <form action="#" method="get">

                <label for="nombre">Nombre:</label>
                <input type="text"
                       id="nombre"
                       name="nombre"
                       required>

                <label for="email">Correo electrónico:</label>
                <input type="email"
                       id="email"
                       name="email"
                       required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje"
                          name="mensaje"
                          rows="5"
                          required></textarea>

                <button type="submit">
                    Enviar mensaje
                </button>

            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Tienda de Informática - Proyecto Git Flow</p>
    </footer>

</body>
</html>
